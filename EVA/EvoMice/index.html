<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title data-i18n="page_title">EvoMice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div id="lang-switcher">
      <button type="button" id="lang-cs-btn">Čeština</button>
      <button type="button" id="lang-en-btn">English</button>
    </div>
    <h1>EvoMice</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </header>

  <main>
    <section id="canvas-area">
      <div id="canvas-toolbar">
        <span class="btn-with-help">
          <button type="button" id="fullscreen-btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="fullscreen_btn_tooltip">?</span>
        </span>
        <!-- Zoom patří k zobrazení plochy, ne k nastavení simulace (spec
             12.3) — proto je tady vedle fullscreen tlačítka, ne ve fieldsetu
             nastavení. -->
        <label id="zoom-control" for="zoom-slider">
          <span data-i18n="zoom_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="zoom_label_tooltip">?</span>
          <input type="range" id="zoom-slider" min="0.5" max="4" step="0.1" value="1">
        </label>
      </div>
      <!-- Zoom (viz applyZoom v render.js) škáluje tenhle obal jako celek,
           ne jen canvas uvnitř — viz spec 8.1. -->
      <div id="zoom-wrapper">
        <div id="canvas-container">
          <canvas id="sim-canvas"></canvas>
        </div>
        <!-- Samostatný obal pro "info" prvky (stats, kurzor, graf fitness) —
             ve fullscreenu ho jde jako celek přesunout vedle plochy místo
             pod ni (spec 12.2), viz #canvas-area:fullscreen #zoom-wrapper
             ve style.css. Mimo fullscreen je to jen neviditelný wrapper,
             nic nemění. -->
        <div id="info-panel">
          <p id="stats-line"></p>
          <p id="cursor-position-line" data-i18n="cursor_position_none"></p>

          <div id="fitness-chart-area">
            <p class="chart-title" data-i18n="fitness_chart_title"></p>
            <canvas id="fitness-chart-canvas" width="320" height="90"></canvas>
            <p class="chart-legend">
              <span class="legend-swatch legend-swatch-min"></span><span data-i18n="fitness_chart_legend_min"></span>
              <span class="legend-swatch legend-swatch-avg"></span><span data-i18n="fitness_chart_legend_avg"></span>
              <span class="legend-swatch legend-swatch-max"></span><span data-i18n="fitness_chart_legend_max"></span>
            </p>
          </div>
        </div>
      </div>
    </section>

    <aside id="controls">

      <fieldset>
        <legend>
          <span data-i18n="section_run_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_run_legend_tooltip">?</span>
        </legend>
        <span class="btn-with-help">
          <button type="button" id="start-pause-btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="start_pause_btn_tooltip">?</span>
        </span>
        <span class="btn-with-help">
          <button type="button" id="step-btn" data-i18n="step_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="step_btn_tooltip">?</span>
        </span>
        <span class="btn-with-help">
          <button type="button" id="reset-btn" data-i18n="reset_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="reset_btn_tooltip">?</span>
        </span>
        <label for="speed-slider">
          <span data-i18n="speed_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="speed_label_tooltip">?</span>
          <span id="speed-value">2</span>
          <input type="range" id="speed-slider" min="0" max="30" step="1" value="2">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_population_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_population_legend_tooltip">?</span>
        </legend>
        <label for="population-size-slider">
          <span data-i18n="population_size_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="population_size_label_tooltip">?</span>
          <span id="population-size-value">80</span>
          <input type="range" id="population-size-slider" min="10" max="400" step="10" value="80">
        </label>
        <label for="grid-size-slider">
          <span data-i18n="grid_size_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="grid_size_label_tooltip">?</span>
          <span id="grid-size-value">48</span>
          <input type="range" id="grid-size-slider" min="8" max="128" step="1" value="48">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_food_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_food_legend_tooltip">?</span>
        </legend>
        <label for="food-count-slider">
          <span data-i18n="food_count_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="food_count_label_tooltip">?</span>
          <span id="food-count-value">20</span>
          <input type="range" id="food-count-slider" min="1" max="150" step="1" value="20">
        </label>
        <label for="food-capacity-slider">
          <span data-i18n="food_capacity_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="food_capacity_label_tooltip">?</span>
          <span id="food-capacity-value">20</span>
          <input type="range" id="food-capacity-slider" min="1" max="50" step="1" value="20">
        </label>
        <label>
          <input type="radio" name="food-mode" id="food-mode-random" value="random" checked>
          <span data-i18n="food_mode_random"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="food_mode_random_tooltip">?</span>
        </label>
        <label>
          <input type="radio" name="food-mode" id="food-mode-manual" value="manual">
          <span data-i18n="food_mode_manual"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="food_mode_manual_tooltip">?</span>
        </label>
        <span class="btn-with-help">
          <button type="button" id="regenerate-food-btn" data-i18n="regenerate_food_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="regenerate_food_btn_tooltip">?</span>
        </span>
        <span class="btn-with-help">
          <button type="button" id="clear-food-btn" data-i18n="clear_food_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="clear_food_btn_tooltip">?</span>
        </span>
        <label>
          <input type="checkbox" id="food-depletes-checkbox">
          <span data-i18n="food_depletes_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="food_depletes_label_tooltip">?</span>
        </label>
        <label>
          <input type="checkbox" id="food-replenishes-checkbox">
          <span data-i18n="food_replenishes_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="food_replenishes_label_tooltip">?</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_fitness_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_fitness_legend_tooltip">?</span>
        </legend>
        <label for="fitness-type-select">
          <span data-i18n="fitness_type_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="fitness_type_label_tooltip">?</span>
          <select id="fitness-type-select">
            <option value="binary" data-i18n="fitness_binary"></option>
            <option value="continuous" data-i18n="fitness_continuous"></option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_selection_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_selection_legend_tooltip">?</span>
        </legend>
        <label for="selection-method-select">
          <span data-i18n="selection_method_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="selection_method_label_tooltip">?</span>
          <select id="selection-method-select">
            <option value="roulette" data-i18n="selection_roulette"></option>
            <option value="tournament" data-i18n="selection_tournament"></option>
          </select>
        </label>
        <label for="tournament-size-slider">
          <span data-i18n="tournament_size_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="tournament_size_label_tooltip">?</span>
          <span id="tournament-size-value">3</span>
          <input type="range" id="tournament-size-slider" min="2" max="10" step="1" value="3">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_crossover_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_crossover_legend_tooltip">?</span>
        </legend>
        <label for="crossover-rate-slider">
          <span data-i18n="crossover_rate_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="crossover_rate_label_tooltip">?</span>
          <span id="crossover-rate-value">0.8</span>
          <input type="range" id="crossover-rate-slider" min="0" max="1" step="0.05" value="0.8">
        </label>
        <label for="crossover-type-select">
          <span data-i18n="crossover_type_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="crossover_type_label_tooltip">?</span>
          <select id="crossover-type-select">
            <option value="xy-split" data-i18n="crossover_xy_split"></option>
            <option value="one-point" data-i18n="crossover_one_point"></option>
            <option value="multi-point" data-i18n="crossover_multi_point"></option>
            <option value="uniform" data-i18n="crossover_uniform"></option>
            <option value="line-point" data-i18n="crossover_line_point"></option>
            <option value="rectangle-point" data-i18n="crossover_rectangle_point"></option>
          </select>
        </label>
        <label for="crossover-points-slider">
          <span data-i18n="crossover_points_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="crossover_points_label_tooltip">?</span>
          <span id="crossover-points-value">3</span>
          <input type="range" id="crossover-points-slider" min="2" max="8" step="1" value="3">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_mutation_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_mutation_legend_tooltip">?</span>
        </legend>
        <label for="mutation-type-select">
          <span data-i18n="mutation_type_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="mutation_type_label_tooltip">?</span>
          <select id="mutation-type-select">
            <option value="bit-flip" data-i18n="mutation_bit_flip"></option>
            <option value="geometric-jump" data-i18n="mutation_geometric_jump"></option>
          </select>
        </label>
        <label for="mutation-rate-slider">
          <span data-i18n="mutation_rate_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="mutation_rate_label_tooltip">?</span>
          <span id="mutation-rate-value">0.02</span>
          <input type="range" id="mutation-rate-slider" min="0" max="0.3" step="0.005" value="0.02">
        </label>
        <label for="mutation-jump-radius-slider">
          <span data-i18n="mutation_jump_radius_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="mutation_jump_radius_label_tooltip">?</span>
          <span id="mutation-jump-radius-value">3</span>
          <input type="range" id="mutation-jump-radius-slider" min="1" max="20" step="1" value="3">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_elitism_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_elitism_legend_tooltip">?</span>
        </legend>
        <label for="elite-count-slider">
          <span data-i18n="elite_count_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="elite_count_label_tooltip">?</span>
          <span id="elite-count-value">2</span>
          <input type="range" id="elite-count-slider" min="0" max="20" step="1" value="2">
        </label>
        <label for="replacement-mode-select">
          <span data-i18n="replacement_mode_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="replacement_mode_label_tooltip">?</span>
          <select id="replacement-mode-select">
            <option value="full" data-i18n="replacement_full"></option>
            <option value="partial" data-i18n="replacement_partial"></option>
          </select>
        </label>
        <label for="replacement-percent-slider">
          <span data-i18n="replacement_percent_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="replacement_percent_label_tooltip">?</span>
          <span id="replacement-percent-value">50</span>
          <input type="range" id="replacement-percent-slider" min="1" max="100" step="1" value="50">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_seed_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_seed_legend_tooltip">?</span>
        </legend>
        <label for="seed-input">
          <span data-i18n="seed_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="seed_label_tooltip">?</span>
          <input type="number" id="seed-input" value="42" step="1">
        </label>
        <span class="btn-with-help">
          <button type="button" id="reseed-btn" data-i18n="reseed_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="reseed_btn_tooltip">?</span>
        </span>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_saveload_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_saveload_legend_tooltip">?</span>
        </legend>
        <label>
          <input type="checkbox" id="saveload-include-board-checkbox">
          <span data-i18n="saveload_include_board_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="saveload_include_board_label_tooltip">?</span>
        </label>
        <span class="btn-with-help">
          <button type="button" id="save-cookie-btn" data-i18n="save_cookie_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="save_cookie_btn_tooltip">?</span>
        </span>
        <span class="btn-with-help">
          <button type="button" id="load-cookie-btn" data-i18n="load_cookie_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="load_cookie_btn_tooltip">?</span>
        </span>
        <span class="btn-with-help">
          <button type="button" id="clear-cookie-btn" data-i18n="clear_cookie_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="clear_cookie_btn_tooltip">?</span>
        </span>
        <span class="btn-with-help">
          <button type="button" id="save-link-btn" data-i18n="save_link_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="save_link_btn_tooltip">?</span>
        </span>
        <label for="save-link-output">
          <span data-i18n="save_link_output_label"></span>
          <input type="text" id="save-link-output" readonly>
        </label>
        <p id="saveload-status-line"></p>
      </fieldset>

    </aside>
  </main>

  <footer>
    <p id="status-line" data-i18n="status_loading"></p>
  </footer>

  <!-- Pořadí scriptů je důležité: žádný build krok, sdílejí globální scope. -->
  <!-- i18n musí být načtené první — slovníky a mechanika překladu, na které
       se odkazují všechny ostatní moduly (statické texty i ty generované
       za běhu v main.js). -->
  <script src="js/i18n/cs.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/genome.js"></script>
  <script src="js/ga.js"></script>
  <script src="js/render.js"></script>
  <script src="js/fitness-chart.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
  <!-- save-load.js záměrně poslední: potřebuje resetSimulation()/stopRunning()/
       redraw() z main.js a nejdřív se má proběhnout výchozí resetSimulation()
       z main.js, než ho tenhle skript případně přepíše daty z URL (spec 12.5). -->
  <script src="js/save-load.js"></script>
</body>
</html>
